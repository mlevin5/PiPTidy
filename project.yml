name: PiPTidy
options:
  bundleIdPrefix: app.piptidy
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  PiPTidyCore:
    type: framework
    platform: macOS
    sources: [Sources/PiPTidyCore]
  PiPTidy:
    type: application
    platform: macOS
    sources: [Sources/PiPTidy]
    resources: [Assets/AppIcon-1024.png]
    dependencies:
      - target: PiPTidyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piptidy.PiPTidy.debug
        PRODUCT_NAME: PiPTidy
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
  PiPTidyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/PiPTidyCoreTests]
    dependencies:
      - target: PiPTidyCore
